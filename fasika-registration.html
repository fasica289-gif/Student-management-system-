<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ፋሲካ የተማሪዎች ምዝገባ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;700&family=Noto+Serif+Ethiopic:wght@600;800&display=swap">
<style>
/* Layout: full-bleed maroon header with gold rule, tab pills overlapping it, then cream cards; same look as the Gibi Gubae form. */
:root{
  --bg:#F7F1E5; --surface:#FFFFFF; --field:#FFFDF8; --ink:#2A2118; --muted:#7A6A57;
  --line:#E6DCC7; --accent:#7A1F2B; --accent-2:#5A1520; --accent-ink:#FFFFFF; --lab:#7A1F2B;
  --gold:#C9A227; --warn:#B3261E; --ok:#2F6B4F; --soft:#F3EAD6;
  --display:"Noto Serif Ethiopic","Abyssinica SIL",Georgia,serif;
  --body:"Noto Sans Ethiopic","Nyala","Abyssinica SIL",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120E; --surface:#241D16; --field:#1C1712; --ink:#F1E8D8; --muted:#B5A68F;
  --line:#443A2D; --accent:#B4414F; --accent-2:#7E2733; --lab:#E59AA4; --warn:#F28B8B; --ok:#7BD39A; --soft:#2D251B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120E; --surface:#241D16; --field:#1C1712; --ink:#F1E8D8; --muted:#B5A68F;
  --line:#443A2D; --accent:#B4414F; --accent-2:#7E2733; --lab:#E59AA4; --warn:#F28B8B; --ok:#7BD39A; --soft:#2D251B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);margin:0;padding-block:0 40px;-webkit-text-size-adjust:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto}
header{background:linear-gradient(160deg,#8A2433,#4A1019);color:#fff;text-align:center;padding-block:26px 78px;border-radius:0 0 34px 34px;border-bottom:4px solid var(--gold)}
header .logo{display:block;width:124px;height:124px;margin:0 auto 12px;border-radius:50%;background:#fff;padding:4px;border:3px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
header .org{font:800 clamp(18px,4.8vw,25px)/1.35 var(--display);text-wrap:balance;margin:0}
header .sub{color:#F0D98A;font-size:13px;margin-top:6px;letter-spacing:.3px}
header .doc{display:inline-block;margin-top:12px;padding:5px 18px;border:1.5px solid #F0D98A;border-radius:999px;color:#fff;font:700 15px var(--body)}
.pull{margin-top:-46px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:22px;margin:0 0 16px;padding:8px 18px 20px;min-width:0;box-shadow:0 10px 30px rgba(60,30,10,.1)}
legend{font:800 17px var(--display);color:var(--lab);padding:0 10px;margin-left:-4px;border-bottom:3px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:8px}
.grid .wide{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:14px;font-weight:700;margin-bottom:5px;color:var(--lab)}
label .req{color:var(--warn)}
.oth{margin-top:8px}.cbs{display:grid;gap:8px;margin-top:2px}
label.cb{display:flex;align-items:center;gap:10px;font-weight:600;margin:0;padding:11px 14px;min-height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
label.cb input{width:22px;height:22px;flex:none;accent-color:var(--accent,#7a1f2b)}
input[type=text],input[type=tel],input[type=number],input[type=password],select{width:100%;min-height:48px;padding:12px 14px;font:400 16px var(--body);
  color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:14px;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.25)}
.with-photo{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
@media (max-width:520px){.with-photo{grid-template-columns:minmax(0,1fr)}.photo{margin:0 auto}}
.photo{width:132px}
.photo .box{width:132px;height:156px;border:2px dashed var(--gold);border-radius:18px;background:var(--field);display:flex;
  align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;font-weight:600;overflow:hidden;cursor:pointer;padding:8px}
.photo .box img{width:100%;height:100%;object-fit:cover;display:block}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pbtns button{flex:1 1 auto;min-height:40px;padding:6px 8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font:600 13px var(--body);cursor:pointer}
.pbtns .x{flex:0 0 auto;color:var(--warn);border-color:var(--warn)}
.sigwrap{position:relative}
canvas.sig{width:100%;height:150px;background:#fff;border:2px dashed var(--gold);border-radius:14px;touch-action:none;display:block;cursor:crosshair}
.sigwrap .clr{position:absolute;right:10px;top:8px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#7A1F2B;font:600 13px var(--body);cursor:pointer}
.sigimg{height:56px;background:#fff;border-radius:6px;border:1px solid var(--line);display:block}
.photo .change{margin-top:6px;font:600 13px var(--body);color:var(--lab);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.pledge{font-size:15px;background:var(--soft);border-left:4px solid var(--gold);padding:12px 14px;margin:12px 0 6px;border-radius:0 14px 14px 0}
.btn{min-height:50px;padding:12px 22px;border-radius:16px;border:0;border-bottom:3px solid var(--gold);background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font:800 16px var(--body);cursor:pointer;box-shadow:0 8px 20px rgba(122,31,43,.3)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:var(--surface);border:2px solid var(--warn);color:var(--warn);box-shadow:none}
.btn.danger.on{background:var(--warn);color:#fff}
.btn.green{background:var(--ok);border-bottom-color:var(--ok);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.actions .btn{flex:1 1 150px}
.banner{padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px;font-size:15px;font-weight:600;text-align:center}
.banner.edit{border-color:var(--gold);background:var(--soft)}
.banner.err{background:rgba(179,38,30,.1);border-color:var(--warn);color:var(--warn)}
.banner.ok{background:rgba(46,125,50,.12);border-color:#2e7d32;color:#2e7d32;line-height:1.7}.banner.ok b{display:block;font-size:19px;letter-spacing:.5px}
.success{text-align:center;padding:40px 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;border-bottom:4px solid var(--gold);box-shadow:0 10px 30px rgba(60,30,10,.1)}
.success .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;line-height:64px;margin:0 auto 12px}
.success h2{font:800 22px var(--display);margin:0 0 6px;color:var(--lab)}
.success .no{font:800 28px var(--display);letter-spacing:.04em;margin:10px 0 20px;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 10px 30px rgba(60,30,10,.1)}
.panel h2{font:800 19px var(--display);margin:0 0 8px;color:var(--lab)}
.pinrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pinrow input{max-width:190px;letter-spacing:.3em;text-align:center;font-size:20px}
.stats{display:flex;gap:10px;margin:0 0 14px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.07)}
.stats b{display:block;font:800 28px/1.2 var(--display);color:var(--lab)}
.stats span{color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input{flex:1 1 100%}
.toolbar .btn{flex:1 1 140px}
.count{color:var(--muted);font-size:14px;margin:0 0 8px}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.row:hover{border-color:var(--gold)}
.row .th{width:52px;height:60px;border-radius:12px;background:var(--soft);object-fit:cover;display:block}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .mt{font-size:13px;color:var(--muted)}
.row .rn{font-size:12px;color:var(--lab);font-weight:700;white-space:nowrap}
.detail dl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:6px 14px;margin:8px 0 18px}
.detail dt{color:var(--muted);font-size:14px}
.detail dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.detail h3{font:800 16px var(--display);color:var(--lab);margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line)}
.photos{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.photos figure{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.photos img{width:112px;height:132px;object-fit:cover;border-radius:16px;border:3px solid var(--gold);display:block}
.menu{display:grid;gap:14px;margin:0 0 16px}
.menubtn{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 18px;border-radius:20px;border:2px solid var(--line);border-bottom:4px solid var(--gold);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 8px 22px rgba(60,30,10,.1)}
.menubtn:hover{border-color:var(--gold)}.menubtn .mi{font-size:36px;flex:none}
.menubtn b{display:block;font:800 19px var(--display);color:var(--lab);margin-bottom:2px}.menubtn small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.inst .btn{flex:none}
.vf{background:var(--soft);border:1px solid var(--gold);border-radius:18px;padding:14px 16px;margin:6px 0 14px}
.xrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.xrow:first-of-type{border-top:0}
.xrow .xl{flex:1 1 100px;font-weight:700}.xrow .xl small{color:var(--muted);font-weight:400}.xrow .btn{flex:0 0 auto;min-height:42px;padding:8px 14px;font-size:14px}
.xwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.xt{border-collapse:collapse;font-size:13px;white-space:nowrap}.xt th{position:sticky;top:0;background:var(--accent);color:#fff;padding:8px 10px;text-align:left;z-index:1}
.xt td{padding:7px 10px;border-top:1px solid var(--line)}.xt tr:nth-child(even) td{background:var(--soft)}
.ov{position:fixed;inset:0;background:rgba(20,10,5,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.ov .success{max-width:420px;width:100%;max-height:92vh;overflow:auto}
footer{text-align:center;padding:14px 0 20px;font-size:14px;color:var(--muted)}footer a,.back{color:var(--lab);font-weight:700;text-decoration:none;cursor:pointer}footer a{display:inline-block;padding:10px 18px;border:2px solid var(--line);border-radius:999px;background:var(--surface)}
.photo .box .plus{display:block;font:300 38px/1 var(--body);color:var(--gold);margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:999px;font-size:15px;font-weight:600;z-index:20;max-width:92vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>

function etDate(d=new Date()){
  const a=Math.floor((14-(d.getMonth()+1))/12), y=d.getFullYear()+4800-a, m=d.getMonth()+1+12*a-3;
  const jdn=d.getDate()+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;
  const r=(jdn-1723856)%1461, n=r%365+365*Math.floor(r/1460);
  const year=4*Math.floor((jdn-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460);
  return {y:year, m:Math.floor(n/30)+1, d:n%30+1};
}
function etString(){ const e=etDate(); return `${ET_MONTHS[e.m-1]} ${e.d}፣ ${e.y}`; }
function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const max=360, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.78)); };
    img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error('image'))}; img.src=url;
  });
}
async function sha(text){
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=5381; for(const ch of text) h=((h<<5)+h+ch.charCodeAt(0))|0; return 'x'+h; }
}

function cloudStore(db){ const S=()=>db.collection('students');
  return {mode:'cloud',
    getPin:async()=>{const x=await db.doc('config/pin').get(); return x.exists?x.data():null},
    setPin:o=>db.doc('config/pin').set(o),
    add:d=>S().add(d), update:(id,p)=>S().doc(id).update(p), remove:id=>S().doc(id).delete(),
    subscribe:(cb,err)=>S().onSnapshot(sn=>cb(sn.docs.map(d=>({id:d.id,...d.data()}))),err)};
}
function localStore(){
  const ls=new Set(); let dbp=null;
  const D=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('fasika-registration',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('students',{keyPath:'id'});r.result.createObjectStore('config',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}));
  const tx=async(st,mode,fn)=>{const d=await D(); return new Promise((res,rej)=>{const t=d.transaction(st,mode); const rq=fn(t.objectStore(st));
    t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);});};
  const emit=async()=>{const l=await tx('students','readonly',o=>o.getAll()); ls.forEach(f=>f(l));};
  return {mode:'local',
    getPin:async()=>(await tx('config','readonly',o=>o.get('pin')))||null,
    setPin:o=>tx('config','readwrite',x=>x.put({id:'pin',...o})),
    add:async d=>{const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await tx('students','readwrite',x=>x.put({id,...d})); emit();},
    update:async(id,p)=>{const c=await tx('students','readonly',x=>x.get(id)); await tx('students','readwrite',x=>x.put({...c,...p,id})); emit();},
    remove:async id=>{await tx('students','readwrite',x=>x.delete(id)); emit();},
    subscribe:cb=>{ls.add(cb); emit().catch(()=>{}); return()=>ls.delete(cb);}};
}

const GAS_URL='https://script.google.com/macros/s/AKfycbzQ9XLXlcQIFux4863DlBHOg4KPkTDwYS7Gg3LToY60SFrw3T9cOl3i9n68WYPjjl5l/exec'; /* ← Apps Script Web App URL እዚህ ያስገቡ (https://script.google.com/macros/s/.../exec) */
function driveStore(url){
  let pin='', ls=new Set();
  const call=async body=>{
    const r=await fetch(url,{method:'POST',body:JSON.stringify(body)});
    const j=await r.json(); if(!j.ok){ const e=new Error(j.error||'error'); e.code=j.error; throw e; } return j;
  };
  const emit=async()=>{ const j=await call({action:'list',pin}); ls.forEach(f=>f(j.rows)); };
  const thumb=src=>new Promise(res=>{ if(!src) return res(''); const im=new Image();
    im.onload=()=>{ const c=document.createElement('canvas'), k=72/Math.max(im.width,im.height); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.6)); };
    im.onerror=()=>res(''); im.src=src; });
  return {mode:'drive',
    getPin:async()=>({drive:1}), setPin:async()=>{},
    login:async p=>{ try{ await call({action:'login',pin:p}); pin=p; return true; }catch(e){ if(e.code==='bad_pin') return false; throw e; } },
    logout:()=>{ pin=''; },
    changePin:async n=>{ await call({action:'changePin',pin,newPin:n}); pin=n; },
    add:async d=>{ await call({action:'add',record:{...d,thumb:await thumb(d.photo)},form:buildFormHtml(d,false)}); if(pin) emit().catch(()=>{}); },
    update:async(id,p,full)=>{ await call({action:'update',pin,id,patch:{...p,...(p.photo!==undefined?{thumb:await thumb(p.photo)}:{})},form:buildFormHtml({...(full||editing||{}),...p},false)}); emit().catch(()=>{}); },
    remove:async id=>{ await call({action:'remove',pin,id}); emit().catch(()=>{}); },
    get:async id=>(await call({action:'get',pin,id})).record,
    getMany:async(ids,lite)=>(await call({action:'getMany',pin,ids,lite})).records,
    refresh:()=>emit(),
    subscribe:(cb,err)=>{ ls.add(cb); emit().catch(e=>err&&err(e)); return()=>ls.delete(cb); }};
}

const sigInk={};
function clearSig(k){ const c=$('#sig-'+k); if(!c) return; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); sigInk[k]=false; }

function initSig(k){
  const c=$('#sig-'+k), g=c.getContext('2d'); g.lineWidth=3.4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#111'; let down=false;
  const pos=e=>{const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{ e.preventDefault(); down=true; try{c.setPointerCapture(e.pointerId);}catch(_){} const [x,y]=pos(e); g.beginPath(); g.moveTo(x,y); g.lineTo(x+.1,y+.1); g.stroke(); sigInk[k]=true; };
  c.onpointermove=e=>{ if(!down) return; e.preventDefault(); const [x,y]=pos(e); g.lineTo(x,y); g.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ down=false; };
  clearSig(k);
}

async function save(filename,data){
  let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){}
  if(dl){ try{ await dl.save({filename,data}); toast('ፋይሉ ተቀምጧል'); }catch(e){ if(!e||e.code!=='declined') toast('ማውረድ አልተሳካም'); } return; }
  try{ const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'}); const u=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('ፋይሉ ተቀምጧል'); }
  catch(e){ toast('ማውረድ አልተሳካም'); }
}

}
const xlsxVal=(s,k,i)=>{ if(k==='#') return String(i+1); const v=s[k]; return /^data:image/.test(v||'')?'✓':(v??''); };
function buildXlsx(list,sheetName='ተማሪዎች'){
  const cols=xlsxCols();

  const L=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  const cell=(r,c,v,st)=>`<c r="${L(c)}${r}" t="inlineStr" s="${st}"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  const val=xlsxVal;
  const rows=[`<row r="1" ht="42" customHeight="1">${cols.map((c,j)=>cell(1,j,c[1],1)).join('')}</row>`,
    ...list.map((s,i)=>`<row r="${i+2}" ht="24" customHeight="1">${cols.map((c,j)=>cell(i+2,j,val(s,c[0],i),2)).join('')}</row>`)];

  const sheet=`${XH}<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" tabSelected="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="20"/><cols>${cols.map((c,j)=>`<col min="${j+1}" max="${j+1}" width="${c[2]}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.join('')}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;
  const styles=`${XH}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Nyala"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Nyala"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF7A1F2B"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFD8C79B"/></left><right style="thin"><color rgb="FFD8C79B"/></right><top style="thin"><color rgb="FFD8C79B"/></top><bottom style="thin"><color rgb="FFD8C79B"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="49" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs></styleSheet>`;
  return zipBlob([
    {name:'[Content_Types].xml',data:`${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
    {name:'_rels/.rels',data:`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`${XH}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xe(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:styles},{name:'xl/worksheets/sheet1.xml',data:sheet}
  ],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ---------- PDF (no libraries): each form page is drawn on a canvas and packed as a JPEG page ---------- */
const xhtmlOf=html=>{ const d=document.createElement('div'); d.innerHTML=html; return new XMLSerializer().serializeToString(d); };
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('img')); i.src=src; });
async function pageJpeg(s){
  const W=794,H=1123,K=2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px;padding:8mm;box-sizing:border-box;background:#fff;color:#000;font:14px/1.9 'Noto Serif Ethiopic','Abyssinica SIL','Nyala',serif"><style>${FORM_CSS}.pg{margin:0!important}</style>${xhtmlOf(formBody(s))}</div></foreignObject></svg>`;
  const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
  const c=document.createElement('canvas'); c.width=W*K; c.height=H*K;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); if(!blob) throw new Error('jpeg');
  return {w:c.width,h:c.height,data:new Uint8Array(await blob.arrayBuffer())};
}
function pdfBlob(pages){
  const chunks=[],offs=[]; let len=0;
  const put=x=>{ const b=typeof x==='string'?enc.encode(x):x; chunks.push(b); len+=b.length; };
  const obj=(n,body)=>{ offs[n]=len; put(`${n} 0 obj\n${body}\nendobj\n`); };
  const n=pages.length;
  put('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>`);
  pages.forEach((p,i)=>{ const a=3+3*i, cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(a,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${a+2} 0 R >> >> /Contents ${a+1} 0 R >>`);
    obj(a+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[a+2]=len; put(`${a+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.data.length} >>\nstream\n`); put(p.data); put('\nendstream\nendobj\n'); });
  const total=3*n+3, xr=len;
  put(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let k=1;k<total;k++) put(String(offs[k]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
function printForms(list){
  const f=document.createElement('iframe'); f.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';
  f.onload=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('ማተም አልተሳካም'); } setTimeout(()=>f.remove(),60000); };
  f.srcdoc=formDoc('የተማሪዎች ቅፆች',list.map(formBody).join(''),false); document.body.appendChild(f);
}
async function savePdf(list,name){
  toast('PDF በማዘጋጀት ላይ…');
  try{ const pages=[]; for(const s of list) pages.push(await pageJpeg(s)); save(name,pdfBlob(pages)); }
  catch(e){ console.error(e); toast('PDF ማዘጋጀት አልተቻለም፤ በምትኩ የማተሚያ መስኮት ይከፈታል (PDF አድርገው ያስቀምጡ)'); printForms(list); }
}
